name: Fading Echo update tracker

on:
  schedule:
    # Toutes les 15 minutes. GitHub peut retarder les crons en periode de charge.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fe-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les donnees doivent atterrir sur la branche servie par GitHub Pages.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer steamcmd
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y steamcmd

      - name: Verifier les updates
        id: check
        env:
          STEAMCMD: /usr/games/steamcmd
        run: python scripts/check_updates.py

      - name: Composer l'email
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/format_email.py

      - name: Envoyer l'email
        if: steps.check.outputs.has_new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Fading Echo Tracker
          to: ${{ secrets.MAIL_TO }}
          subject: "[Fading Echo] ${{ steps.check.outputs.subject }}"
          html_body: file://email_body.html
          convert_markdown: false

      - name: Publier updates.json
        run: |
          rm -f new_updates.json email_body.html
          if [ -z "$(git status --porcelain updates.json)" ]; then
            echo "Aucun changement a publier."
            exit 0
          fi
          git config user.name "fe-tracker[bot]"
          git config user.email "fe-tracker@users.noreply.github.com"
          git add updates.json
          git commit -m "tracker: maj des updates Fading Echo"
          git push
