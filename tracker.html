<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>FE Tracker</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#00F5FF">
    <link rel="icon" type="image/png" href="Images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tracker.css">
</head>
<body class="tracker-page">
    <div class="bg-animation"></div>

    <div class="tracker-shell">
        <div class="tracker-widget" id="trackerWidget">
            <div class="tracker-head">
                <div class="tracker-brand">
                    <i class="fas fa-satellite-dish"></i>
                    <div>
                        <h1>FE Tracker</h1>
                        <p id="trackerStatus" class="tracker-status">Connexion…</p>
                    </div>
                </div>
                <div class="tracker-controls">
                    <button id="armBtn" class="tracker-btn" type="button">
                        <i class="fas fa-bell"></i><span>Activer les alertes</span>
                    </button>
                    <button id="muteBtn" class="tracker-btn icon-only" type="button" title="Couper le son" aria-label="Couper le son">
                        <i class="fas fa-volume-high"></i>
                    </button>
                </div>
            </div>

            <div class="tracker-feed" id="trackerFeed">
                <p class="tracker-empty">Chargement des updates…</p>
            </div>

            <div class="tracker-foot">
                <span id="trackerChecked">—</span>
                <span class="tracker-live"><i class="fas fa-circle"></i> polling 60 s</span>
            </div>
        </div>
    </div>

    <script src="site.js"></script>
    <script src="tracker.js"></script>
</body>
</html>
